name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest asgi-lifespan httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Execute Pytest Suite
        run: |
          pytest -v

  docker-smoke-test:
    name: Docker Build & Health Check
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t student-retention-api:ci .

      - name: Run Container & Verify Health
        run: |
          docker run -d -p 8000:8000 --name api-smoke-test student-retention-api:ci
          
          # Poll /health endpoint for up to 30 seconds
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for API startup... ($i/10)"
            sleep 3
          done

          echo "API failed health check on startup."
          docker logs api-smoke-test
          exit 1